services:
  postgres:
    image: postgres:17
    container_name: iceberg-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: iceberg_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iceberg_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: